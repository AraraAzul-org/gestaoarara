name: Teste mensal de restore

on:
  schedule:
    - cron: '0 4 1 * *'   # dia 1º, 01:00 de Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-mensal-gestaoarara
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      LOCAL_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar segredos
        run: |
          set -euo pipefail
          source .github/scripts/dropbox.sh
          dbx_check_env BACKUP_PASSPHRASE DROPBOX_REFRESH_TOKEN DROPBOX_APP_KEY DROPBOX_APP_SECRET
          echo "::add-mask::$BACKUP_PASSPHRASE"

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.3.0

      - name: Baixar o backup mais recente e verificar integridade
        run: |
          set -euo pipefail
          source .github/scripts/dropbox.sh
          DBX_TOKEN="$(dbx_token)"
          export DBX_TOKEN

          ARQ="$(dbx_listar \
            | jq -r '.name | select(startswith("gestaoarara-") and endswith(".tar.gz.gpg"))' \
            | sort -r \
            | head -n 1)"
          [[ -n "$ARQ" ]] || { echo "::error::Nenhum backup encontrado no Dropbox" >&2; exit 1; }
          echo "Backup selecionado: $ARQ"

          dbx_download "/${ARQ}" backup.gpg
          # O backup grava o sidecar como <data>.sha256 (sem .tar.gz).
          SIDECAR="${ARQ%.tar.gz.gpg}.sha256"
          dbx_download "/${SIDECAR}" backup.sha256

          HASH="$(awk '{print $1}' backup.sha256)"
          echo "${HASH}  backup.gpg" | sha256sum -c -

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --decrypt backup.gpg > backup.tar.gz
          tar -tzf backup.tar.gz >/dev/null

          mkdir -p restore
          tar -xzf backup.tar.gz -C restore

          for arquivo in roles.sql schema.sql data.sql migrations.sql; do
            esperado="$(jq -r --arg f "$arquivo" '.sha256[$f] // empty' restore/manifest.json)"
            [[ -n "$esperado" ]] || { echo "::error::Manifest sem checksum de $arquivo" >&2; exit 1; }
            obtido="$(sha256sum "restore/$arquivo" | cut -d' ' -f1)"
            [[ "$esperado" = "$obtido" ]] || { echo "::error::Checksum divergente: $arquivo" >&2; exit 1; }
          done

          echo "### Backup íntegro. Manifest:"
          jq . restore/manifest.json

      - name: Subir stack Supabase local
        run: |
          set -euo pipefail
          docker --version
          supabase init
          supabase start

      - name: Restaurar no banco local e comparar contagens
        run: |
          set -euo pipefail

          # Na stack local o superuser e supabase_admin; o postgres nao tem
          # permissao para criar objetos em auth/storage. Devolve o superuser
          # a ele usando a conexao interna do container (sem senha na URL).
          DBCTR="$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n1)"
          [[ -n "$DBCTR" ]] || { echo "::error::Container do banco local nao encontrado" >&2; exit 1; }
          docker exec "$DBCTR" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c 'alter role postgres with superuser;' >/dev/null
          echo "### postgres local e superuser: $(psql "$LOCAL_DB" -Atc "select current_setting('is_superuser')")"

          # O dump do projeto hospedado traz ALTER ROLE postgres sem superuser;
          # filtramos esses comandos para nao rebaixar o papel local de novo.
          if grep -qi 'role postgres' restore/roles.sql; then
            echo "### Ignorando comandos de ROLE postgres do dump"
            grep -vi 'role postgres' restore/roles.sql > restore/roles-local.sql || true
          else
            cp restore/roles.sql restore/roles-local.sql
          fi
          psql "$LOCAL_DB" -v ON_ERROR_STOP=0 -f restore/roles-local.sql > /dev/null 2>&1 || true
          echo "### postgres local e superuser: $(psql "$LOCAL_DB" -Atc "select current_setting('is_superuser')")"

          # Banco local descartável: remove os schemas que a stack cria para
          # que o schema.sql do backup recrie tabelas e tipos exatamente como
          # no projeto de origem (evita "type aal_level already exists").
          psql "$LOCAL_DB" -v ON_ERROR_STOP=1 <<'SQL'
          drop schema if exists private cascade;
          drop schema if exists storage cascade;
          drop schema if exists auth cascade;
          drop schema if exists public cascade;
          -- A stack local nao cria supabase_migrations; o dump de migracoes
          -- e data-only e precisa da tabela com as colunas do projeto remoto.
          create schema if not exists supabase_migrations;
          create table if not exists supabase_migrations.schema_migrations (
            version text not null,
            statements text[],
            name text,
            created_by text,
            idempotency_key text,
            rollback text[]
          );
          create unique index if not exists schema_migrations_pkey
            on supabase_migrations.schema_migrations (version);
          create unique index if not exists schema_migrations_idempotency_key_key
            on supabase_migrations.schema_migrations (idempotency_key);
          SQL

          psql "$LOCAL_DB" -v ON_ERROR_STOP=1 -f restore/schema.sql
          psql "$LOCAL_DB" -v ON_ERROR_STOP=1 -f restore/data.sql
          # O dump e data-only e pode trazer CREATE SCHEMA redundante.
          psql "$LOCAL_DB" -v ON_ERROR_STOP=0 -f restore/migrations.sql

          export LOCAL_DB
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          manifest = json.load(open("restore/manifest.json", encoding="utf-8"))
          falhou = False
          print("### Comparação de contagens (esperado / obtido)")
          for tabela, esperado in manifest["contagens"].items():
              r = subprocess.run(
                  ["psql", os.environ["LOCAL_DB"], "-Atc", f"select count(*) from {tabela}"],
                  capture_output=True,
                  text=True,
              )
              if r.returncode != 0:
                  print(f"ERRO ao consultar {tabela}: {r.stderr.strip()}")
                  falhou = True
                  continue
              obtido = int(r.stdout.strip() or -1)
              situacao = "OK" if obtido == esperado else "DIVERGENTE"
              print(f"{situacao:11} {tabela}: {esperado} / {obtido}")
              if obtido != esperado:
                  falhou = True
          sys.exit(1 if falhou else 0)
          PY

          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest = json.load(open("restore/manifest.json", encoding="utf-8"))
          extra = json.load(open("restore/extra.json", encoding="utf-8"))
          falhou = False
          print("### Verificação de Storage, Edge Functions e Auth")

          if extra.get("storage") != manifest.get("storage"):
              print("DIVERGENTE storage: manifest != extra")
              falhou = True
          if extra.get("functions") != manifest.get("functions"):
              print("DIVERGENTE functions: manifest != extra")
              falhou = True
          if extra.get("auth_config") != manifest.get("auth_config"):
              print("DIVERGENTE auth_config: manifest != extra")
              falhou = True

          def sha(caminho):
              return hashlib.sha256(pathlib.Path(caminho).read_bytes()).hexdigest()

          for chave, info in extra["storage"].items():
              caminho = pathlib.Path("restore/storage") / chave
              if not caminho.is_file():
                  print(f"FALTANDO storage: {chave}")
                  falhou = True
                  continue
              ok = sha(caminho) == info["sha256"] and caminho.stat().st_size == info["size"]
              print(f"{'OK' if ok else 'DIVERGENTE':11} storage {chave}: {info['size']} bytes")
              if not ok:
                  falhou = True

          for slug, info in extra["functions"].items():
              pasta = pathlib.Path("restore/functions") / slug
              for nome, esperado in info["sha256"].items():
                  caminho = pasta / nome
                  if not caminho.is_file():
                      print(f"FALTANDO function {slug}: {nome}")
                      falhou = True
                      continue
                  ok = sha(caminho) == esperado
                  print(f"{'OK' if ok else 'DIVERGENTE':11} function {slug}/{nome}")
                  if not ok:
                      falhou = True
              meta = pasta / "metadata.json"
              if not meta.is_file() or sha(meta) != info["metadata_sha256"]:
                  print(f"DIVERGENTE function {slug}/metadata.json")
                  falhou = True
              else:
                  print(f"OK          function {slug}/metadata.json")

          caminho = pathlib.Path("restore/auth-config.json")
          if not caminho.is_file() or sha(caminho) != extra["auth_config"]["sha256"]:
              print("DIVERGENTE auth-config.json")
              falhou = True
          else:
              print("OK          auth-config.json")

          if len(extra["storage"]) != manifest["contagens"]["storage.objects"]:
              print("DIVERGENTE storage.objects: manifest vs arquivos")
              falhou = True

          sys.exit(1 if falhou else 0)
          PY

      - name: Encerrar stack local
        if: ${{ always() }}
        run: |
          supabase stop || true
