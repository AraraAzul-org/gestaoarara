name: Backup diário Supabase → Dropbox

on:
  schedule:
    - cron: '0 3 * * *'   # 00:00 de Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-diario-gestaoarara
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Opcional e preferencial: senha pura, sem codificacao na URI.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      # Necessarios para o que fica FORA do dump do Postgres.
      SUPABASE_URL: https://gnosjzdguifktkspxwkt.supabase.co
      SUPABASE_PROJECT_REF: gnosjzdguifktkspxwkt
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar segredos
        run: |
          set -euo pipefail
          source .github/scripts/dropbox.sh
          dbx_check_env SUPABASE_DB_URL BACKUP_PASSPHRASE DROPBOX_REFRESH_TOKEN DROPBOX_APP_KEY DROPBOX_APP_SECRET SUPABASE_SERVICE_ROLE_KEY SUPABASE_ACCESS_TOKEN
          echo "::add-mask::$BACKUP_PASSPHRASE"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          echo "Todos os segredos estão presentes."

      - name: Derivar URL IPv4 do session pooler
        run: |
          set -euo pipefail
          # Os runners do GitHub Actions nao tem IPv6. A conexao direta
          # (db.<ref>.supabase.co:5432) so responde em IPv6, entao usamos o
          # session pooler da mesma regiao (IPv4).
          # O usuario do pooler e sempre postgres.<ref>, independentemente
          # do usuario que vier no segredo; somente a senha e preservada.
          DB_URL="$(SUPABASE_DB_URL="$SUPABASE_DB_URL" SUPABASE_DB_PASSWORD="$SUPABASE_DB_PASSWORD" python3 - <<'PY'
          import os
          import sys
          from urllib.parse import quote, unquote, urlsplit

          url = os.environ["SUPABASE_DB_URL"].strip()
          erro_formato = "::error::SUPABASE_DB_URL invalida. Formato: postgresql://postgres:SENHA@db.gnosjzdguifktkspxwkt.supabase.co:5432/postgres (senha com caracteres especiais codificados em percent)"
          if "://" not in url:
              print(erro_formato, file=sys.stderr)
              sys.exit(1)
          esquema, resto = url.split("://", 1)
          if esquema not in ("postgres", "postgresql"):
              print(erro_formato, file=sys.stderr)
              sys.exit(1)
          # Separa pelo ULTIMO @: a senha pode conter @, #, /, ? ou colchetes
          # sem codificar, e urlsplit nao aceita isso na autoridade.
          arroba = resto.rfind("@")
          if arroba == -1:
              print(erro_formato, file=sys.stderr)
              sys.exit(1)
          userinfo, host_parte = resto[:arroba], resto[arroba + 1:]
          dois_pontos = userinfo.find(":")
          if dois_pontos == -1:
              print("::error::SUPABASE_DB_URL sem senha. Formato: postgresql://postgres:SENHA@db.gnosjzdguifktkspxwkt.supabase.co:5432/postgres", file=sys.stderr)
              sys.exit(1)
          usuario, senha_raw = unquote(userinfo[:dois_pontos]), userinfo[dois_pontos + 1:]
          # Se o segredo SUPABASE_DB_PASSWORD existir, ele e a fonte da senha:
          # cola a senha pura do painel, sem codificar caracteres especiais.
          senha_secreta = os.environ.get("SUPABASE_DB_PASSWORD", "").strip()
          if senha_secreta:
              senha_raw = senha_secreta
              origem_senha = "segredo SUPABASE_DB_PASSWORD"
          else:
              origem_senha = "SUPABASE_DB_URL"
          if not senha_raw:
              print(erro_formato, file=sys.stderr)
              sys.exit(1)
          # Testa as formas possiveis: senha crua, codificada uma vez e duas vezes.
          candidatos = []
          for cand in (senha_raw, unquote(senha_raw), unquote(unquote(senha_raw))):
              for variante in (cand, cand.strip()):
                  if variante and variante not in candidatos:
                      candidatos.append(variante)
          if any("[YOUR-PASSWORD]" in c.upper() for c in candidatos):
              print("::error::SUPABASE_DB_URL ainda contem o placeholder [YOUR-PASSWORD]. Substitua-o pela senha real do banco no segredo do GitHub.", file=sys.stderr)
              sys.exit(1)
          # Valida o host (essa parte nao contem a senha).
          try:
              partes = urlsplit(f"{esquema}://{host_parte}")
          except ValueError:
              print("::error::host invalido na SUPABASE_DB_URL", file=sys.stderr)
              sys.exit(1)
          if not partes.hostname or "." not in (partes.hostname or ""):
              print("::error::host invalido na SUPABASE_DB_URL", file=sys.stderr)
              sys.exit(1)
          import subprocess
          base = "postgresql://postgres.gnosjzdguifktkspxwkt:{}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
          escolhida = None
          for indice, cand in enumerate(candidatos, 1):
              url_teste = base.format(quote(cand, safe=""))
              try:
                  teste = subprocess.run(
                      ["psql", url_teste, "-Atc", "select 1"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=25,
                      env={**os.environ, "PGCONNECT_TIMEOUT": "10"},
                  )
              except Exception:
                  continue
              if teste.returncode == 0:
                  escolhida = (indice, cand, url_teste)
                  break
          if escolhida is None:
              tamanhos = ",".join(str(len(c)) for c in candidatos)
              print(f"::error::Nenhuma forma da senha conectou ao pooler (tamanhos testados: {tamanhos}). Use Reset database password em Settings > Database e grave a senha nova no segredo SUPABASE_DB_PASSWORD (somente a senha, sem URI)", file=sys.stderr)
              sys.exit(1)
          indice, senha, DB_URL = escolhida
          # Diagnostico seguro: nunca imprime a senha, apenas o tamanho.
          print(f"### Origem: host={partes.hostname} usuario={usuario} senha_com={len(senha)}_caracteres forma={indice}/{len(candidatos)} fonte={origem_senha}", file=sys.stderr)
          print(DB_URL)
          PY
          )"
          echo "::add-mask::$DB_URL"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "PGUSER=postgres.gnosjzdguifktkspxwkt" >> "$GITHUB_ENV"
          echo "### Usando session pooler IPv4 (usuario postgres.<ref>)"

      - name: Testar conexão com o banco
        run: |
          set -euo pipefail
          # Falha cedo, sem baixar imagem Docker, se a senha do segredo estiver errada.
          # Nota: o pooler sempre reporta o usuario como "postgres" na mensagem de
          # erro, mesmo quando o cliente envia postgres.<ref> corretamente.
          psql "$DB_URL" -Atc 'select 1' >/dev/null
          echo "### Conexão OK"

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.3.0

      - name: Gerar dumps lógicos
        run: |
          set -euo pipefail
          mkdir -p backup

          # Papéis personalizados do cluster (os papéis padrão do Supabase já
          # existem em qualquer projeto novo e são ignorados pelo CLI).
          supabase db dump --remote="$DB_URL" --role-only -f backup/roles.sql

          # Schema e dados. auth/storage/private são incluídos porque o projeto
          # tem triggers em auth.users, funções em private e RLS em storage.
          # O CLI usa o pg_dump compatível com a versão do servidor (17).
          supabase db dump --remote="$DB_URL" \
            --schema public,private,auth,storage -f backup/schema.sql

          supabase db dump --remote="$DB_URL" \
            --data-only --schema public,private,auth,storage -f backup/data.sql

          # Histórico de migrações aplicadas no projeto de origem.
          supabase db dump --remote="$DB_URL" \
            --data-only --schema supabase_migrations -f backup/migrations.sql

          echo "Dumps gerados:"
          wc -l backup/*.sql

      - name: Baixar Storage, Edge Functions e config do Auth
        run: |
          set -euo pipefail
          mkdir -p backup/storage backup/functions

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from email import policy
          from email.parser import BytesParser

          BASE = os.environ["SUPABASE_URL"].rstrip("/")
          REF = os.environ["SUPABASE_PROJECT_REF"]
          SERVICO = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          TOKEN = os.environ["SUPABASE_ACCESS_TOKEN"]
          OUT = pathlib.Path("backup")
          STORAGE = OUT / "storage"
          FUNCTIONS = OUT / "functions"
          STORAGE.mkdir(parents=True, exist_ok=True)
          FUNCTIONS.mkdir(parents=True, exist_ok=True)

          def http(url, headers, data=None, method=None, timeout=90):
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.read(), resp.headers.get("Content-Type", "")
              except urllib.error.HTTPError as exc:
                  detalhe = exc.read().decode("utf-8", "replace")[:300]
                  raise SystemExit(f"HTTP {exc.code} em {url.split('?')[0]}: {detalhe}")

          def sha(conteudo):
              return hashlib.sha256(conteudo).hexdigest()

          def seguro(nome):
              nome = str(nome).replace("\\", "/")
              partes = nome.split("/")
              if not nome or nome.startswith("/") or ".." in partes or "\x00" in nome:
                  raise SystemExit(f"Nome inseguro: {nome!r}")
              return nome

          def arquivos_da_function(conteudo, tipo):
              tipo = (tipo or "").lower()
              if tipo.startswith("multipart/"):
                  cabecalho = f"Content-Type: {tipo}\r\nMIME-Version: 1.0\r\n\r\n".encode()
                  mensagem = BytesParser(policy=policy.default).parsebytes(cabecalho + conteudo)
                  achados = []
                  for parte in mensagem.iter_parts():
                      disp = parte.get("Content-Disposition", "")
                      m = re.search(r'filename="([^"]+)"', disp) or re.search(r"filename=([^;\s]+)", disp)
                      nome = m.group(1) if m else (parte.get_param("name") or f"arquivo-{len(achados)}")
                      dados = parte.get_payload(decode=True)
                      if dados is None:
                          dados = str(parte.get_payload()).encode()
                      achados.append((os.path.basename(nome), dados))
                  return achados
              try:
                  dado = json.loads(conteudo)
              except Exception:
                  return [("index.ts", conteudo)]

              def texto(v):
                  return v.encode() if isinstance(v, str) else bytes(v)

              if isinstance(dado, dict):
                  if isinstance(dado.get("files"), list):
                      return [(os.path.basename(str(f.get("name") or f.get("path") or "index.ts")),
                               texto(f.get("content", f.get("data", "")))) for f in dado["files"]]
                  for chave in ("body", "source", "content", "data"):
                      if chave in dado:
                          return [("index.ts", texto(dado[chave]))]
              if isinstance(dado, list):
                  return [(os.path.basename(str(f.get("name") or f"arquivo-{i}")),
                           texto(f.get("content", ""))) for i, f in enumerate(dado)]
              return [("index.ts", conteudo)]

          # --- Storage: todos os buckets e todos os objetos ---
          cabecalho_storage = {"apikey": SERVICO, "Authorization": "Bearer " + SERVICO}
          bruto, _ = http(BASE + "/storage/v1/bucket", cabecalho_storage)
          buckets = json.loads(bruto)
          if not isinstance(buckets, list):
              raise SystemExit("Resposta inesperada ao listar buckets")

          storage = {}
          for bucket in buckets:
              nome_bucket = seguro(bucket["name"])
              (STORAGE / nome_bucket).mkdir(parents=True, exist_ok=True)
              offset = 0
              while True:
                  corpo = json.dumps({
                      "prefix": "", "limit": 100, "offset": offset,
                      "sortBy": {"column": "name", "order": "asc"},
                  }).encode()
                  rota = "/storage/v1/object/list/" + urllib.parse.quote(nome_bucket, safe="")
                  lista, _ = http(BASE + rota, {**cabecalho_storage, "Content-Type": "application/json"}, corpo, "POST")
                  pagina = json.loads(lista)
                  if not isinstance(pagina, list):
                      raise SystemExit(f"Lista de objetos inesperada no bucket {nome_bucket}")
                  for objeto in pagina:
                      nome_objeto = seguro(objeto.get("name", ""))
                      destino = STORAGE / nome_bucket / nome_objeto
                      destino.parent.mkdir(parents=True, exist_ok=True)
                      rota = ("/storage/v1/object/" + urllib.parse.quote(nome_bucket, safe="") + "/" +
                              urllib.parse.quote(nome_objeto, safe="/"))
                      blob, _ = http(BASE + rota, cabecalho_storage)
                      destino.write_bytes(blob)
                      storage[f"{nome_bucket}/{nome_objeto}"] = {
                          "bucket": nome_bucket,
                          "name": nome_objeto,
                          "sha256": sha(blob),
                          "size": len(blob),
                      }
                  if len(pagina) < 100:
                      break
                  offset += 100

          # --- Edge Functions: codigo + metadados ---
          cabecalho_api = {"Authorization": "Bearer " + TOKEN, "Accept": "application/json"}
          base_api = "https://api.supabase.com/v1/projects/" + REF
          bruto, _ = http(base_api + "/functions", cabecalho_api)
          funcoes = json.loads(bruto)
          if not isinstance(funcoes, list):
              raise SystemExit("Resposta inesperada ao listar Edge Functions")

          functions = {}
          for funcao in funcoes:
              slug = seguro(funcao["slug"])
              conteudo, tipo = http(base_api + "/functions/" + urllib.parse.quote(slug, safe="") + "/body", cabecalho_api)
              arquivos = arquivos_da_function(conteudo, tipo)
              if not arquivos:
                  raise SystemExit(f"Function {slug} sem arquivos no download")
              pasta = FUNCTIONS / slug
              pasta.mkdir(parents=True, exist_ok=True)
              hashes = {}
              for nome, dados in arquivos:
                  nome = seguro(nome)
                  (pasta / nome).write_bytes(dados)
                  hashes[nome] = sha(dados)
              meta = {k: funcao.get(k) for k in (
                  "slug", "name", "status", "version", "verify_jwt",
                  "import_map", "entrypoint_path", "ezbr_sha256")}
              (pasta / "metadata.json").write_text(
                  json.dumps(meta, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              functions[slug] = {**meta, "sha256": hashes,
                                 "metadata_sha256": sha((pasta / "metadata.json").read_bytes())}

          # --- Configuracao do Auth (redirects, SMTP, provedores, etc.) ---
          bruto, _ = http(base_api + "/config/auth", cabecalho_api)
          (OUT / "auth-config.json").write_bytes(bruto)
          auth_config = {"sha256": sha(bruto), "size": len(bruto)}

          (OUT / "extra.json").write_text(
              json.dumps({"storage": storage, "functions": functions, "auth_config": auth_config},
                         ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          echo "### Complementos baixados:"
          jq '{storage: (.storage | length), functions: (.functions | keys), auth_config: (.auth_config.size)}' backup/extra.json

      - name: Checagem de conteúdo e manifest
        run: |
          set -euo pipefail

          for arquivo in roles.sql schema.sql data.sql migrations.sql extra.json auth-config.json; do
            if [[ ! -s "backup/$arquivo" ]]; then
              echo "::error::Arquivo vazio ou ausente: $arquivo" >&2
              exit 1
            fi
          done

          grep -qi 'RESET ALL' backup/roles.sql || { echo "::error::roles.sql inválido" >&2; exit 1; }
          grep -qi 'create table if not exists "public"\."usuario"' backup/schema.sql || { echo "::error::schema.sql sem public.usuario" >&2; exit 1; }
          grep -qi 'insert into "public"\."jovem"' backup/data.sql || { echo "::error::data.sql sem dados de jovem" >&2; exit 1; }
          grep -qi 'insert into "auth"\."users"' backup/data.sql || { echo "::error::data.sql sem auth.users" >&2; exit 1; }
          grep -qi 'schema_migrations' backup/migrations.sql || { echo "::error::migrations.sql sem histórico" >&2; exit 1; }

          contar() { psql "$DB_URL" -Atc "$1" | tr -d '[:space:]'; }
          sha() { sha256sum "backup/$1" | cut -d' ' -f1; }

          jq -n \
            --slurpfile extra backup/extra.json \
            --arg criadoEm "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg origem "gnosjzdguifktkspxwkt" \
            --argjson usuario "$(contar 'select count(*) from public.usuario')" \
            --argjson jovem "$(contar 'select count(*) from public.jovem')" \
            --argjson usuarioMenu "$(contar 'select count(*) from public.usuario_menu')" \
            --argjson acessolog "$(contar 'select count(*) from public.acessolog')" \
            --argjson authUsers "$(contar 'select count(*) from auth.users')" \
            --argjson storageObjects "$(contar 'select count(*) from storage.objects')" \
            --argjson migracoes "$(contar 'select count(*) from supabase_migrations.schema_migrations')" \
            --arg shaRoles "$(sha roles.sql)" \
            --arg shaSchema "$(sha schema.sql)" \
            --arg shaData "$(sha data.sql)" \
            --arg shaMigrations "$(sha migrations.sql)" \
            '{
              criadoEm: $criadoEm,
              origem: $origem,
              contagens: {
                "public.usuario": $usuario,
                "public.jovem": $jovem,
                "public.usuario_menu": $usuarioMenu,
                "public.acessolog": $acessolog,
                "auth.users": $authUsers,
                "storage.objects": $storageObjects,
                "supabase_migrations.schema_migrations": $migracoes
              },
              sha256: {
                "roles.sql": $shaRoles,
                "schema.sql": $shaSchema,
                "data.sql": $shaData,
                "migrations.sql": $shaMigrations,
                "auth-config.json": $extra[0].auth_config.sha256
              },
              storage: $extra[0].storage,
              functions: $extra[0].functions,
              auth_config: $extra[0].auth_config
            }' > backup/manifest.json

          [[ "$(jq '.storage | length' backup/extra.json)" = "$(jq -r '.contagens["storage.objects"]' backup/manifest.json)" ]] || { echo "::error::Quantidade de arquivos no Storage divergente do manifest" >&2; exit 1; }
          [[ "$(jq '.functions | length' backup/extra.json)" -gt 0 ]] || { echo "::error::Nenhuma Edge Function exportada" >&2; exit 1; }
          jq -e '.auth_config.sha256' backup/extra.json >/dev/null || { echo "::error::Config do Auth ausente" >&2; exit 1; }

          echo "### Manifest do backup"
          jq . backup/manifest.json

      - name: Compactar, criptografar e validar localmente
        run: |
          set -euo pipefail
          DIA="$(date -u +%Y-%m-%d)"
          ARQ="gestaoarara-${DIA}"
          echo "ARQ=$ARQ" >> "$GITHUB_ENV"

          tar -czf "${ARQ}.tar.gz" -C backup \
            manifest.json extra.json roles.sql schema.sql data.sql migrations.sql auth-config.json \
            storage functions
          tar -tzf "${ARQ}.tar.gz" >/dev/null

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "${ARQ}.tar.gz.gpg" "${ARQ}.tar.gz"

          # Prova que o arquivo criptografado abre e volta byte a byte.
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --decrypt "${ARQ}.tar.gz.gpg" > "${ARQ}.verificado.tar.gz"
          cmp "${ARQ}.tar.gz" "${ARQ}.verificado.tar.gz"
          tar -tzf "${ARQ}.verificado.tar.gz" >/dev/null
          rm -f "${ARQ}.verificado.tar.gz"

          sha256sum "${ARQ}.tar.gz.gpg" > "${ARQ}.sha256"
          echo "### Arquivo pronto: ${ARQ}.tar.gz.gpg"
          cat "${ARQ}.sha256"

      - name: Enviar ao Dropbox e conferir o upload
        run: |
          set -euo pipefail
          source .github/scripts/dropbox.sh
          DBX_TOKEN="$(dbx_token)"
          export DBX_TOKEN

          dbx_upload "/${ARQ}.tar.gz.gpg" "${ARQ}.tar.gz.gpg" >/dev/null
          dbx_upload "/${ARQ}.sha256" "${ARQ}.sha256" >/dev/null

          mkdir -p verificacao
          dbx_download "/${ARQ}.tar.gz.gpg" "verificacao/${ARQ}.gpg"
          HASH="$(awk '{print $1}' "${ARQ}.sha256")"
          echo "${HASH}  verificacao/${ARQ}.gpg" | sha256sum -c -

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --decrypt "verificacao/${ARQ}.gpg" > "verificacao/${ARQ}.tar.gz"
          tar -tzf "verificacao/${ARQ}.tar.gz" >/dev/null

          echo "### Upload conferido: sha256 e descriptografia OK"

          dbx_limpar_antigos 'gestaoarara-' 30 3
          echo "### Retenção de 30 dias aplicada"
          dbx_listar | jq -r '.name'
